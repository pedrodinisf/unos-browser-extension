<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>URL Grepper</title>
  <style>
    * {
      box-sizing: border-box;
    }
    
    body {
      width: 350px;
      padding: 12px;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      font-size: 13px;
      color: #333;
      background: #fff;
    }
    
    h1 {
      margin: 0 0 12px 0;
      font-size: 18px;
      font-weight: 600;
      color: #1a1a1a;
    }
    
    label {
      display: flex;
      align-items: center;
      margin: 10px 0;
      cursor: pointer;
    }

    #toggleEnabled {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.2s, border-color 0.2s;
      margin-bottom: 10px;
    }

    #toggleEnabled.off {
      background: #f8f8f8;
      color: #333;
    }

    #toggleEnabled.off:hover {
      background: #e8e8e8;
      border-color: #999;
    }

    #toggleEnabled.on {
      background: #4a90e2;
      color: white;
      border-color: #4a90e2;
    }

    #toggleEnabled.on:hover {
      background: #357abd;
      border-color: #357abd;
    }
    
    input[type="text"] {
      width: 100%;
      padding: 6px 8px;
      margin-top: 4px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 13px;
      transition: border-color 0.2s;
    }
    
    input[type="text"]:focus {
      outline: none;
      border-color: #4a90e2;
      box-shadow: 0 0 0 2px rgba(74, 144, 226, 0.1);
    }
    
    .button-group {
      display: flex;
      gap: 8px;
      margin: 12px 0;
    }
    
    button {
      flex: 1;
      padding: 8px 12px;
      border: 1px solid #ccc;
      border-radius: 4px;
      background: #f8f8f8;
      color: #333;
      font-size: 13px;
      cursor: pointer;
      transition: background-color 0.2s, border-color 0.2s;
    }
    
    button:hover:not(:disabled) {
      background: #e8e8e8;
      border-color: #999;
    }
    
    button:active:not(:disabled) {
      background: #ddd;
    }
    
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    
    #download {
      background: #4a90e2;
      color: white;
      border-color: #4a90e2;
    }
    
    #download:hover:not(:disabled) {
      background: #357abd;
      border-color: #357abd;
    }
    
    #count {
      font-size: 11px;
      color: #666;
      margin-bottom: 6px;
    }
    
    #list {
      max-height: 250px;
      overflow-y: auto;
      border: 1px solid #ddd;
      border-radius: 4px;
      padding: 8px;
      font-size: 12px;
      background: #fafafa;
    }
    
    .empty {
      color: #999;
      text-align: center;
      padding: 20px;
      font-style: italic;
    }
    
    .url {
      word-break: break-all;
      margin: 4px 0;
      padding: 4px;
      background: white;
      border-radius: 2px;
      line-height: 1.4;
    }
    
    .url:hover {
      background: #f0f0f0;
    }
    
    #status {
      font-size: 11px;
      margin-top: 8px;
      padding: 4px 8px;
      border-radius: 4px;
      min-height: 20px;
    }
    
    #status.success {
      background: #d4edda;
      color: #155724;
    }
    
    #status.error {
      background: #f8d7da;
      color: #721c24;
    }
    
    /* Scrollbar styling */
    #list::-webkit-scrollbar {
      width: 8px;
    }
    
    #list::-webkit-scrollbar-track {
      background: #f1f1f1;
      border-radius: 4px;
    }
    
    #list::-webkit-scrollbar-thumb {
      background: #888;
      border-radius: 4px;
    }
    
    #list::-webkit-scrollbar-thumb:hover {
      background: #555;
    }

    /* Capture section */
    .separator {
      border: none;
      border-top: 1px solid #ddd;
      margin: 16px 0 12px;
    }

    .section-title {
      font-size: 14px;
      font-weight: 600;
      color: #1a1a1a;
      margin: 0 0 10px 0;
    }

    .capture-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }

    .capture-controls label {
      margin: 0;
      font-size: 12px;
      color: #555;
      white-space: nowrap;
    }

    .capture-controls select {
      padding: 4px 6px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 12px;
      background: white;
    }

    #captureFullPage {
      width: 100%;
      padding: 10px;
      background: #2ecc71;
      color: white;
      border: 1px solid #2ecc71;
      border-radius: 4px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    #captureFullPage:hover:not(:disabled) {
      background: #27ae60;
      border-color: #27ae60;
    }

    #captureFullPage:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .progress-container {
      display: none;
      margin-top: 10px;
    }

    .progress-container.active {
      display: block;
    }

    .progress-bar-bg {
      width: 100%;
      height: 6px;
      background: #e0e0e0;
      border-radius: 3px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: #4a90e2;
      border-radius: 3px;
      transition: width 0.3s ease;
    }

    .progress-text {
      font-size: 11px;
      color: #666;
      margin-top: 4px;
      text-align: center;
    }
  </style>
</head>
<body>
  <h1>URL Grepper</h1>
  
  <button id="toggleEnabled" class="off" aria-label="Toggle URL grepping">Enable</button>
  
  <label>
    <span>Grep String:</span>
    <input type="text" id="grepStr" placeholder="e.g., example.com" aria-label="Grep string to match in URLs">
  </label>
  
  <div class="button-group">
    <button id="clear" aria-label="Clear URL list">Clear List</button>
    <button id="download" aria-label="Download URLs as text file">Download urls.txt</button>
  </div>
  
  <div id="count"></div>
  <div id="list" role="log" aria-live="polite" aria-label="List of collected URLs">Loading...</div>
  <div id="status" role="status" aria-live="polite"></div>

  <hr class="separator">
  <h2 class="section-title">Capture</h2>

  <div class="capture-controls">
    <label for="scrollDelay">Scroll delay:</label>
    <select id="scrollDelay" aria-label="Scroll delay between captures">
      <option value="300">300ms (default)</option>
      <option value="500">500ms (thorough)</option>
      <option value="1000">1000ms (slow)</option>
    </select>
  </div>

  <button id="captureFullPage" aria-label="Capture full page screenshot">Capture Full Page</button>

  <div class="progress-container" id="progressContainer">
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="progressBar"></div>
    </div>
    <div class="progress-text" id="progressText"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
